#
# Columns map 1:1 onto the rendered header row:
#   name/url · released · type · params · ~int4 · context · modes · think · bench · license · best_for · status
# type ∈ {llm, vlm, stt, speaker}  (filter chips on the page)
# think  ∈ {yes, opt, no, ~}       (~ = not applicable)
# status ∈ current | superseded | legacy | gated | research | demo   (rendered as /models/ chips)
# size_gb is decimal GB at rough int4 (~0.55 GB per billion params), excluding KV cache and runtime.
# Where a vendor number is used it is marked with † on the page rather than here.

