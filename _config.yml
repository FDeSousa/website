# Site settings
title: "// TODO: title"
description: >-
  Blog and recipes by Filipe
url: "https://desousa.com.pt"

# Build settings
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/
timezone: Europe/London

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  sort_field: date
  sort_reverse: true

minima:
  date_format: "%-d %B %Y"

plugins:
  - jekyll-cooklang-converter
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag

# Collections
collections:
  recipes:
    output: true
    permalink: /recipes/:path/
  projects:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

# Files that shouldn't end up on the site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
