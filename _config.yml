# Site settings
title: "// TODO: title"
description: >-
  Blog and recipes.
url: "https://desousa.com.pt"

# Build settings
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/
timezone: Europe/London

header_pages:
  - about.md
  - recipes.md
  - projects.md

minima:
  date_format: "%-d %B %Y"

plugins:
  - jekyll-cooklang-converter
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  recipes:
    output: true
    permalink: /recipes/:path/
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe
  - scope:
      path: ""
      type: projects
    values:
      layout: page

# Files that shouldn't end up on the site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
