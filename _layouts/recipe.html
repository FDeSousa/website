---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/Recipe">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content recipe e-content" itemprop="recipeInstructions">
    {%- if page.intro -%}
    <div class="recipe-intro">
      {{ page.intro | markdownify }}
    </div>
    {%- endif -%}

    {{ content }}

    {%- if page.note -%}
    <p class="recipe-note">{{ page.note }}</p>
    {%- endif -%}
  </div>

</article>
